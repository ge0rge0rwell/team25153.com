[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for client-side routes (e.g. /awards, /blog/...).
# Netlify serves real static files (like /admin/index.html and /admin/config.yml)
# before applying this catch-all, so the CMS keeps working.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
