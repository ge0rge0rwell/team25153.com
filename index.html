<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cartesian-logo-transparent.png" />
    <link rel="apple-touch-icon" href="/cartesian-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Everything between these markers is replaced per-route by the Express
         server (server/seo.js) so each URL ships its own title, description,
         canonical, social tags and structured data. The defaults below are what
         a visitor gets in `vite dev` or if injection ever fails. -->
    <!--seo:start-->
    <title>Cartesian Robotics #25153</title>
    <meta
      name="description"
      content="Cartesian Robotics #25153 is a student-led FIRST Tech Challenge (FTC) and FRC robotics team from Ankara, Türkiye. Inspire Award winners and FIRST World Championship competitors."
    />
    <link rel="canonical" href="https://team25153.com/" />
    <meta property="og:title" content="Cartesian Robotics #25153" />
    <meta
      property="og:description"
      content="A student-led FTC and FRC robotics team from Ankara, Türkiye. I think, therefore I can."
    />
    <meta property="og:image" content="https://team25153.com/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--seo:end-->

    <!-- Warm up the connection to the external image CDN used across pages -->
    <link rel="preconnect" href="https://team25153.com" crossorigin />
    <link rel="dns-prefetch" href="https://team25153.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
