# ── team25153.com → React + Express app ──────────────────────────────────────
server {
    listen 80;
    server_name team25153.com www.team25153.com;

    # Let's Encrypt challenge (used during cert issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://team25153.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name team25153.com www.team25153.com;

    ssl_certificate     /etc/letsencrypt/live/team25153.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team25153.com/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── lms.team25153.com → Moodle ───────────────────────────────────────────────
server {
    listen 80;
    server_name lms.team25153.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lms.team25153.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lms.team25153.com;

    ssl_certificate     /etc/letsencrypt/live/lms.team25153.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.team25153.com/privkey.pem;

    client_max_body_size 100M;

    # Allow the main site to embed Moodle in an iframe
    proxy_hide_header X-Frame-Options;
    add_header Content-Security-Policy "frame-ancestors 'self' https://team25153.com";

    location / {
        proxy_pass         http://moodle:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffer_size       128k;
        proxy_buffers         4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout      300s;
    }
}
