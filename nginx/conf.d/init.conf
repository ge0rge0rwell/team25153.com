# Temporary HTTP-only config used during first-time SSL certificate setup.
# After running scripts/init-ssl.sh this file is no longer needed.
server {
    listen 80;
    server_name team25153.com www.team25153.com lms.team25153.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'SSL setup in progress...';
        add_header Content-Type text/plain;
    }
}
